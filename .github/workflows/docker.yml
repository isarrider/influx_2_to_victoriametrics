name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Integration test (InfluxDB ${{ matrix.influxdb }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        influxdb: ["2.7-alpine", "2-alpine"]
    steps:
      - uses: actions/checkout@v5

      - name: Syntax check
        run: |
          python3 -m py_compile i2vm.py tests/gen_data.py
          bash -n tests/integration.sh

      - name: Build test image
        run: docker build --build-arg INFLUXDB_TAG=${{ matrix.influxdb }} -t i2vm:test .

      - name: End-to-end migration InfluxDB -> VictoriaMetrics
        env:
          WORK: ${{ runner.temp }}/i2vm
        run: tests/integration.sh i2vm:test influxdb:${{ matrix.influxdb }}

      - name: Upload export dir (state.json, compare_report.csv)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i2vm-export-${{ matrix.influxdb }}
          path: ${{ runner.temp }}/i2vm/export/*.csv
          if-no-files-found: ignore

  publish:
    name: Publish to ghcr.io
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
